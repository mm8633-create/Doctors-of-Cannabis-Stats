<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cannabis Clinic Statistics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Cannabis Clinic Statistics Dashboard</h1>
    </header>
    <main>
        <section id="overview">
            <h2>Overview</h2>
            <p>This dashboard provides insights into cannabis clinic statistics.</p>
        </section>
        <section id="data">
            <h2>Data</h2>
            <table>
                <thead>
                    <tr>
                        <th>Clinic Name</th>
                        <th>Patients Treated</th>
                        <th>Success Rate</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Green Health Clinic</td>
                        <td>120</td>
                        <td>95%</td>
                    </tr>
                    <tr>
                        <td>Care Center</td>
                        <td>200</td>
                        <td>90%</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Cannabis Clinic Statistics</p>
    </footer>
</body>
</html>
