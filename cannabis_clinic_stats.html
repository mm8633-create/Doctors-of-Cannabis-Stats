<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docs of Cann - Stats Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .dashboard-container { max-width: 1400px; margin: 40px auto; }
        .table-responsive { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nav-tabs .nav-link.active { font-weight: bold; color: #0d6efd; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold text-primary">📊 Docs of Cann - Interactive Stats</h1>
        <p class="lead text-muted">Upload your CSV files to view, sort, and search your data.</p>
        
        <div class="d-inline-block text-start" style="max-width: 500px; width: 100%;">
            <input type="file" id="csvFileInput" class="form-control form-control-lg border-primary shadow-sm" accept=".csv" multiple>
        </div>
    </div>

    <ul class="nav nav-tabs" id="csvTabs" role="tablist"></ul>
    
    <div class="tab-content mt-4" id="csvTabContent"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    document.getElementById('csvFileInput').addEventListener('change', function(event) {
        const files = event.target.files;
        const tabsContainer = document.getElementById('csvTabs');
        const contentContainer = document.getElementById('csvTabContent');
        
        // Clear previous uploads
        tabsContainer.innerHTML = '';
        contentContainer.innerHTML = '';

        if (files.length === 0) return;

        Array.from(files).forEach((file, index) => {
            // Clean up the file name to use as a tab title
            let title = file.name.replace('Docs of Cann Stats - ', '').replace('.csv', '');
            let tabId = 'tab-' + index;

            // 1. Create the Tab
            const tabItem = document.createElement('li');
            tabItem.className = 'nav-item';
            tabItem.innerHTML = `
                <button class="nav-link ${index === 0 ? 'active' : ''}" id="${tabId}-tab" data-bs-toggle="tab" 
                data-bs-target="#${tabId}-pane" type="button" role="tab">${title}</button>
            `;
            tabsContainer.appendChild(tabItem);

            // 2. Create the Content Pane
            const contentPane = document.createElement('div');
            contentPane.className = `tab-pane fade ${index === 0 ? 'show active' : ''}`;
            contentPane.id = `${tabId}-pane`;
            contentPane.setAttribute('role', 'tabpanel');
            
            const tableWrapper = document.createElement('div');
            tableWrapper.className = 'table-responsive mt-3';
            
            const table = document.createElement('table');
            table.className = 'table table-striped table-hover align-middle w-100';
            table.id = `table-${index}`;
            
            tableWrapper.appendChild(table);
            contentPane.appendChild(tableWrapper);
            contentContainer.appendChild(contentPane);

            // 3. Parse CSV and build the table
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    if (data.length === 0) return;

                    // Extract headers dynamically
                    const headers = Object.keys(data[0]);
                    
                    // Format data for DataTables
                    const columns = headers.map(header => ({ title: header, data: header }));
                    
                    // Initialize DataTable
                    $(`#table-${index}`).DataTable({
                        data: data,
                        columns: columns,
                        pageLength: 25,
                        order: [], // Keeps the original order initially
                        language: {
                            search: "Filter records:"
                        }
                    });
                }
            });
        });
    });
</script>
</body>
</html>
